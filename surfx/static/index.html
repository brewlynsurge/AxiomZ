<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surfx Search</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Surfx Search</h1>
        <form id="search-form">
            <input type="text" id="search-input" placeholder="Enter your search query" required>
            <button type="submit">Go</button>
        </form>
        <div id="results"></div>
    </div>
    <script>
        console.log("JavaScript loaded"); // Debug: Confirm script runs
        const form = document.getElementById('search-form');
        const resultsContainer = document.getElementById('results');

        form.addEventListener('submit', async (event) => {
            event.preventDefault(); // Prevent page reload
            const query = document.getElementById('search-input').value.trim();
            console.log("Search submitted with query:", query); // Debug: Log query

            try {
                // Fetch search results
                const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
                console.log("Fetch response status:", response.status); // Debug: Log status
                if (!response.ok) throw new Error(`HTTP error: ${response.status}`);

                const results = await response.json();
                console.log("Received results:", results); // Debug: Log results

                // Clear previous results
                resultsContainer.innerHTML = '';

                if (results.length === 0) {
                    resultsContainer.innerHTML = '<p>No results found.</p>';
                } else {
                    // Display each result
                    results.forEach(result => {
                        const resultDiv = document.createElement('div');
                        resultDiv.className = 'result';
                        resultDiv.innerHTML = `
                            <h2><a href="${result.link}" target="_blank">${result.title}</a></h2>
                            <p>${result.description}</p>
                        `;
                        resultsContainer.appendChild(resultDiv);
                    });
                }

                // Clear input
                document.getElementById('search-input').value = '';
            } catch (error) {
                console.error("Search error:", error); // Debug: Log error
                resultsContainer.innerHTML = '<p class="error">Failed to load search results.</p>';
            }
        });
    </script>
</body>
</html>
